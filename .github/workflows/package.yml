name: Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Package application
        run: uv run python scripts/build_package.py --clean

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: TilingForestSolver-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
