name: Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Package application
        run: uv run python scripts/build_package.py --clean

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: TilingForestSolver-${{ runner.os }}
          path: dist/*.zip
          archive: false
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: TilingForestSolver-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
